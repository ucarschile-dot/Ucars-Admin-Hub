<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ucars Hub - Arriendos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="/stitch-export/shared.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-[#f8f9ff] text-[#0b1c30]">
<main class="mx-auto max-w-7xl px-4 py-8 md:px-8">
  <header class="mb-8 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <p class="text-xs font-bold uppercase tracking-widest text-[#785a00]">Ucars Hub</p>
      <h1 class="mt-1 text-3xl font-bold">Arriendos</h1>
      <p class="mt-1 text-sm text-[#444748]">Seguimiento de contratos y días restantes.</p>
    </div>
    <a class="rounded-lg bg-[#131414] px-4 py-2 text-sm font-semibold text-white" href="/stitch-export/index.html">Volver al inicio</a>
  </header>
  <section class="overflow-hidden rounded-xl border border-[#c4c7c7] bg-white shadow-sm">
    <div id="arriendos-status" class="border-b border-[#c4c7c7] bg-[#eff4ff] px-4 py-3 text-sm text-[#444748]">Cargando arriendos desde Notion...</div>
    <div class="overflow-x-auto">
      <table class="w-full min-w-[900px] text-left text-sm">
        <thead class="bg-[#eff4ff] text-xs uppercase tracking-wide text-[#444748]"><tr>
          <th class="px-4 py-3">Auto</th><th class="px-4 py-3">Ucariano</th><th class="px-4 py-3">Inicio</th><th class="px-4 py-3">Término</th><th class="px-4 py-3">Plazo</th><th class="px-4 py-3">Deadline</th><th class="px-4 py-3">Días restantes</th>
        </tr></thead>
        <tbody id="arriendos-body"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
(function () {
  var status = document.getElementById('arriendos-status');
  var body = document.getElementById('arriendos-body');
  function escapeHtml(value) { return String(value || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;'); }
  function cell(value) { return '<td class="border-t border-[#e5eeff] px-4 py-3">' + escapeHtml(value || '-') + '</td>'; }
  fetch('/api/arriendos', { cache: 'no-store' })
    .then(function (response) { return response.json().then(function (payload) { if (!response.ok) throw new Error(payload.error || 'No se pudo consultar Arriendos.'); return payload; }); })
    .then(function (payload) {
      var rows = Array.isArray(payload.arriendos) ? payload.arriendos : [];
      status.textContent = rows.length + ' arriendo' + (rows.length === 1 ? '' : 's') + ' cargados desde Notion.';
      body.innerHTML = rows.length ? rows.map(function (item) {
        var days = item.diasArriendoRestantes;
        var tone = days !== null && days <= 7 ? 'text-[#ba1a1a] font-bold' : 'text-[#0b1c30]';
        return '<tr>' + cell(item.auto) + cell(item.ucariano) + cell(item.fechaInicio) + cell(item.fechaTermino) + cell(item.plazo) + cell(item.deadline) + '<td class="border-t border-[#e5eeff] px-4 py-3 ' + tone + '">' + escapeHtml(days === null ? '-' : days) + '</td></tr>';
      }).join('') : '<tr><td colspan="7" class="px-4 py-8 text-center text-[#444748]">No hay arriendos registrados.</td></tr>';
    })
    .catch(function (error) { status.textContent = error.message; body.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-[#ba1a1a]">No fue posible cargar los arriendos.</td></tr>'; });
})();
</script>
</body>
</html>
