<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ucars Hub Admin</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <style>
    :root {
      color-scheme: light;
      --ui-scale: 1;
      --bg: #f8f9ff;
      --bar-bg: #282828;
      --topbar-height: 100px;
      --topbar-padding-x: 20px;
      --topbar-padding-y: 16px;
      --brand-width: 200px;
      --brand-height: 180px;
      --nav-gap: 50px;
      --nav-link-height: 55px;
      --nav-link-padding-x: 16px;
      --nav-link-font-size: 1.2rem;
      --content-gap: 40px;
      --content-top-offset: calc(var(--topbar-height) + var(--content-gap));
      --sidebar-text: #F9F9F9;
      --sidebar-active: #f5c34b;
      --sidebar-active-bg: rgba(245, 195, 75, 0.13);
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 30px rgba(11, 28, 48, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    html {
      zoom: var(--ui-scale);
      width: calc(100% / var(--ui-scale));
    }

    body {
      margin: 0;
      min-width: 1200px;
      font-family: Inter, "Segoe UI", sans-serif;
      color: #0b1c30;
      background: var(--bg);
    }

    .layout {
      height: calc(100vh / var(--ui-scale));
      min-height: calc(100vh / var(--ui-scale));
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      height: var(--topbar-height);
      padding: var(--topbar-padding-y) var(--topbar-padding-x);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--sidebar-text);
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      transition: transform 220ms ease, box-shadow 220ms ease;
      transform: translateY(0);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
    }

    .topbar.is-hidden {
      transform: translateY(-110%);
    }

    .brand {
      position: absolute;
      left: var(--topbar-padding-x);
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: var(--brand-width);
      background: var(--bar-bg);
    }

    .brand-logo-wrap {
      width: var(--brand-width);
      max-width: var(--brand-width);
      height: var(--brand-height);
      overflow: hidden;
      background: var(--bar-bg);
    }

    .brand-logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      transform: none;
      transform-origin: center;
    }

    .brand p {
      display: none;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--nav-gap);
      flex-wrap: nowrap;
      flex: 0 0 auto;
      margin: 0 auto;
    }

    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: var(--nav-link-height);
      padding: 0 var(--nav-link-padding-x);
      color: var(--sidebar-text);
      text-decoration: none;
      border-left: 0;
      border-bottom: 2px solid transparent;
      border-radius: 4px;
      font-size: var(--nav-link-font-size);
      transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    }

    .nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-link.is-active {
      color: var(--sidebar-active);
      background: var(--sidebar-active-bg);
      border-bottom-color: var(--sidebar-active);
    }

    .content {
      position: relative;
      height: calc(100vh / var(--ui-scale));
      min-height: calc(100vh / var(--ui-scale));
      padding-top: var(--content-top-offset);
      overflow: hidden;
      background: var(--bg);
    }

    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .screen.is-active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      z-index: 1;
    }

    .screen iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--bg);
    }

    .vehicle-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      background: rgba(11, 28, 48, 0.56);
    }

    .vehicle-overlay.is-open {
      display: flex;
    }

    .vehicle-sheet {
      width: 100%;
      max-width: none;
      height: 100%;
      max-height: none;
      overflow: auto;
      border-radius: 0;
      background: #ffffff;
      box-shadow: 0 24px 64px rgba(11, 28, 48, 0.3);
    }

    .vehicle-sheet-header {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid #c4c7c7;
      background: #ffffff;
    }

    .vehicle-sheet-title { margin: 0; font-size: 1.35rem; }
    .vehicle-sheet-kicker { margin: 0 0 5px; color: #785a00; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .vehicle-sheet-close { width: 36px; height: 36px; border: 0; border-radius: 50%; background: #eff4ff; color: #0b1c30; cursor: pointer; font-size: 1.4rem; }
    .vehicle-sheet-body { padding: 24px; }
    .vehicle-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .vehicle-detail { padding: 12px; border: 1px solid #c4c7c7; border-radius: 6px; }
    .vehicle-detail-label { display: block; color: #444748; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .vehicle-detail-value { display: block; margin-top: 5px; overflow-wrap: anywhere; }
    .vehicle-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid #d3e4fe; }
    .vehicle-section h3 { margin: 0 0 12px; font-size: 1rem; }
    .vehicle-documents { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .vehicle-document { display: flex; justify-content: space-between; gap: 12px; padding: 12px; border: 1px solid #c4c7c7; border-radius: 6px; color: #0b1c30; text-decoration: none; }
    .vehicle-document[href]:hover { border-color: #785a00; background: #fffdf7; }
    .vehicle-document-empty { color: #444748; background: #eff4ff; }
    @media (max-width: 700px) {
      .vehicle-sheet-header, .vehicle-sheet-body { padding: 16px; }
      .vehicle-details, .vehicle-documents { grid-template-columns: 1fr; }
    }

  </style>
</head>
<body>
  <div class="layout">
    <header class="topbar" aria-label="Navegacion principal">
      <div class="brand">
        <div class="brand-logo-wrap">
          <img class="brand-logo" src="/stitch-export/logo-sidebar.png" alt="Ucars" />
        </div>
        <p>Panel administrativo</p>
      </div>
      <nav class="nav">
        <a class="nav-link" data-screen="stock" href="#stock">Stock</a>
        <a class="nav-link" data-screen="ucarianos" href="#ucarianos">Ucarianos</a>
        <a class="nav-link" data-screen="agenda" href="#agenda">Agenda</a>
        <a class="nav-link" data-screen="leads" href="#leads">Prospectos</a>
        <a class="nav-link" data-screen="notificaciones" href="#notificaciones">Notificaciones</a>
        <a class="nav-link" data-screen="pruebas" href="#pruebas">Pruebas</a>
      </nav>
    </header>

    <main class="content" aria-live="polite">
      <section class="screen" data-screen="stock">
        <iframe src="/stitch-export/stock.html" title="Stock"></iframe>
      </section>
      <section class="screen" data-screen="ucarianos">
        <iframe src="/stitch-export/ucarianos.html" title="Ucarianos"></iframe>
      </section>
      <section class="screen" data-screen="agenda">
        <iframe src="/stitch-export/agenda.html" title="Agenda"></iframe>
      </section>
      <section class="screen" data-screen="leads">
        <iframe src="/stitch-export/leads.html" title="Prospectos"></iframe>
      </section>
      <section class="screen" data-screen="notificaciones">
        <iframe src="/stitch-export/notificaciones.html" title="Notificaciones"></iframe>
      </section>
      <section class="screen" data-screen="pruebas">
        <iframe src="/stitch-export/pruebas.html" title="Pruebas"></iframe>
      </section>
    </main>
  </div>
  <div aria-hidden="true" aria-labelledby="hub-vehicle-title" aria-modal="true" class="vehicle-overlay" id="hub-vehicle-overlay" role="dialog">
    <section class="vehicle-sheet" role="document">
      <header class="vehicle-sheet-header">
        <div>
          <p class="vehicle-sheet-kicker">Ficha del vehiculo</p>
          <h2 class="vehicle-sheet-title" id="hub-vehicle-title">Vehiculo</h2>
        </div>
        <button aria-label="Cerrar ficha del vehiculo" class="vehicle-sheet-close" id="hub-vehicle-close" type="button">&times;</button>
      </header>
      <div class="vehicle-sheet-body" id="hub-vehicle-content"></div>
    </section>
  </div>

  <script>
    (function () {
      var topbar = document.querySelector('.topbar');
      var iframeWindows = new Map();
      var validScreens = ['stock', 'ucarianos', 'agenda', 'leads', 'notificaciones', 'pruebas'];
      var defaultScreen = 'stock';
      var topbarVisible = true;
      var lastScrollY = 0;
      var scrollRaf = 0;
      var activeScrollSource = null;
      var activeScreen = defaultScreen;
      var vehicleOverlay = document.getElementById('hub-vehicle-overlay');
      var vehicleContent = document.getElementById('hub-vehicle-content');
      var vehicleTitle = document.getElementById('hub-vehicle-title');
      var vehicleClose = document.getElementById('hub-vehicle-close');

      function applyUiScale() {
        var fhdWidth = 1920;
        var fhdHeight = 1080;
        var scale = Math.max(1, Math.min(window.innerWidth / fhdWidth, window.innerHeight / fhdHeight));
        document.documentElement.style.setProperty('--ui-scale', scale.toFixed(3));
      }

      applyUiScale();
      window.addEventListener('resize', applyUiScale);

      function getCurrentScrollY(source) {
        if (!source) {
          return 0;
        }

        try {
          if (typeof source.scrollY === 'number') {
            return source.scrollY;
          }

          if (source.document && source.document.documentElement) {
            return source.document.documentElement.scrollTop || source.document.body.scrollTop || 0;
          }
        } catch (_) {
          return 0;
        }

        return 0;
      }

      function applyTopbarVisibility(nextVisible) {
        topbarVisible = nextVisible;

        if (topbar) {
          topbar.classList.toggle('is-hidden', !nextVisible);
        }

      }

      function escapeHtml(value) {
        return String(value || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
      }

      function documentHtml(label, url) {
        if (!url) {
          return '<div class="vehicle-document vehicle-document-empty"><span>' + label + '</span><span>No registrado</span></div>';
        }
        return '<a class="vehicle-document" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer"><span>' + label + '</span><span>Abrir</span></a>';
      }

      function formatCurrency(amount) {
        return '$' + Math.round(amount).toLocaleString('es-CL');
      }

      function getSalesCommission(price) {
        var amount = Number(String(price || '').replace(/[^\d]/g, ''));
        return Number.isFinite(amount) && amount > 0 ? formatCurrency(amount * 0.03) : 'No disponible';
      }

      function getRentalForVehicle(vehicleId) {
        return fetch('/api/arriendos', { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) return { arriendos: [] };
            return response.json();
          })
          .then(function (payload) {
            var rentals = Array.isArray(payload.arriendos) ? payload.arriendos : [];
            return rentals.find(function (rental) { return rental.autoId === vehicleId; }) || null;
          })
          .catch(function () { return null; });
      }

      function renderVehicleOverlay(vehicle, rental) {
        if (!vehicleContent || !vehicleTitle) return;
        var value = function (item) { return escapeHtml(item || 'No registrado'); };
        var rentalDays = rental && rental.diasArriendoRestantes !== null
          ? String(rental.diasArriendoRestantes) + ' dias'
          : 'Sin arriendo vigente';
        vehicleTitle.textContent = vehicle.name || 'Vehiculo sin nombre';
        vehicleContent.innerHTML = [
          '<div class="vehicle-details">',
          '<div class="vehicle-detail"><span class="vehicle-detail-label">VIN</span><span class="vehicle-detail-value">' + value(vehicle.vin) + '</span></div>',
          '<div class="vehicle-detail"><span class="vehicle-detail-label">Patente</span><span class="vehicle-detail-value">' + value(vehicle.licensePlate) + '</span></div>',
          '<div class="vehicle-detail"><span class="vehicle-detail-label">Origen</span><span class="vehicle-detail-value">' + value(vehicle.origin) + '</span></div>',
          '<div class="vehicle-detail"><span class="vehicle-detail-label">Estado</span><span class="vehicle-detail-value">' + value(vehicle.status) + '</span></div>',
          '</div>',
          '<section class="vehicle-section"><h3>Certificados y documentos</h3><div class="vehicle-documents">',
          documentHtml('Revision tecnica', vehicle.technicalInspectionUrl),
          documentHtml('Permiso de circulacion', vehicle.circulationPermitUrl),
          documentHtml('Otros certificados', vehicle.otherCertificatesUrl),
          '</div></section>',
          '<section class="vehicle-section"><h3>Contrato de arriendo</h3><div class="vehicle-documents">',
          documentHtml('Contrato de arriendo', vehicle.rentalContractUrl),
          '</div><div class="vehicle-details" style="margin-top: 12px;">',
          '<div class="vehicle-detail"><span class="vehicle-detail-label">Ucariano asignado</span><span class="vehicle-detail-value">' + value(rental && rental.ucariano !== 'Sin asignar' ? rental.ucariano : vehicle.assignedUcariano) + '</span></div>',
          '<div class="vehicle-detail"><span class="vehicle-detail-label">Dias de arriendo restantes</span><span class="vehicle-detail-value">' + value(rentalDays) + '</span></div>',
          '<div class="vehicle-detail"><span class="vehicle-detail-label">Comision de venta (3%)</span><span class="vehicle-detail-value">' + getSalesCommission(vehicle.price) + '</span></div>',
          '</div></section>'
        ].join('');
      }

      function openVehicleOverlay(vehicle) {
        if (!vehicleOverlay || !vehicleContent || !vehicleTitle) return;
        renderVehicleOverlay(vehicle, null);
        vehicleOverlay.classList.add('is-open');
        vehicleOverlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        applyTopbarVisibility(false);
        vehicleClose.focus();
        getRentalForVehicle(vehicle.id).then(function (rental) {
          if (vehicleOverlay.classList.contains('is-open')) {
            renderVehicleOverlay(vehicle, rental);
          }
        });
      }

      function closeVehicleOverlay() {
        if (!vehicleOverlay) return;
        vehicleOverlay.classList.remove('is-open');
        vehicleOverlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        applyTopbarVisibility(true);
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin || !event.data || event.data.type !== 'ucars:vehicle-detail') {
          return;
        }

        if (event.data.open) {
          openVehicleOverlay(event.data.vehicle || {});
        } else {
          closeVehicleOverlay();
        }
      });

      vehicleClose.addEventListener('click', closeVehicleOverlay);
      vehicleOverlay.addEventListener('click', function (event) {
        if (event.target === vehicleOverlay) closeVehicleOverlay();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeVehicleOverlay();
      });

      function syncTopbarVisibility() {
        var currentScrollY = getCurrentScrollY(activeScrollSource);
        var delta = currentScrollY - lastScrollY;
        var hideThreshold = 18;
        var showThreshold = 10;

        if (delta > hideThreshold && topbarVisible) {
          applyTopbarVisibility(false);
        } else if (delta < -showThreshold && !topbarVisible) {
          applyTopbarVisibility(true);
        }

        if (currentScrollY <= 0) {
          applyTopbarVisibility(true);
        }

        lastScrollY = currentScrollY;
        scrollRaf = 0;
      }

      function onScroll(source) {
        if (scrollRaf) {
          return;
        }

        if (source) {
          activeScrollSource = source;
        }

        scrollRaf = window.requestAnimationFrame(syncTopbarVisibility);
      }

      function attachScrollSource(screenName, source) {
        if (!screenName || !source || iframeWindows.get(screenName) === source) {
          return;
        }

        iframeWindows.set(screenName, source);
        source.addEventListener('scroll', function () {
          if (screenName !== activeScreen) {
            return;
          }

          onScroll(source);
        }, { passive: true });
      }

      function normalizeIframe(frame) {
        try {
          var doc = frame.contentDocument;
          if (!doc) return;

          if (doc.getElementById('ucars-embed-reset')) {
            return;
          }

          var style = doc.createElement('style');
          style.id = 'ucars-embed-reset';
          style.textContent = [
            'nav.fixed.left-0, aside.fixed.left-0, nav[class*="left-0"][class*="fixed"], aside[class*="left-0"][class*="fixed"] { display: none !important; }',
            'header.fixed.top-0 { display: none !important; }',
            'html, body { margin: 0 !important; background: #f8f9ff !important; }',
            '[class*="md:ml-[260px]"], [class*="ml-[260px]"] { margin-left: 0 !important; }',
            '[class*="md:left-[260px]"], [class*="left-[260px]"] { left: 0 !important; }',
            '[class*="md:w-[calc(100%-260px)]"], [class*="w-[calc(100%-260px)]"] { width: 100% !important; }',
            '[class*="md:pl-[260px]"], [class*="pl-[260px]"] { padding-left: 0 !important; }',
            '[class*="md:pt-16"], [class*="pt-16"] { padding-top: 0 !important; }',
            '.md\\:hidden { display: none !important; }',
            '.md\\:flex { display: flex !important; }'
          ].join(' ');
          doc.head.appendChild(style);

          localizeIframe(doc);
        } catch (_) {
          // Ignore sanitization errors and keep rendering the iframe as-is.
        }
      }

      function localizeIframe(doc) {
        var dictionary = [
          ['Dealership Admin', 'Panel administrativo'],
          ['Notifications', 'Notificaciones'],
          ['Vehicle Stock', 'Stock de vehiculos'],
          ['Manage and monitor dealership inventory.', 'Gestiona y monitorea el inventario de la automotora.'],
          ['Add New Stock', 'Agregar vehiculo'],
          ['Add Vehicle', 'Agregar vehiculo'],
          ['All Brands', 'Todas las marcas'],
          ['All Ucarianos', 'Todos los ucarianos'],
          ['Search stock, VIN...', 'Buscar stock o VIN...'],
          ['Search...', 'Buscar...'],
          ["Today's Agenda", 'Agenda de hoy'],
          ['Ucarianos Directory', 'Directorio de ucarianos'],
          ['Leads Dashboard', 'Panel de Prospectos'],
          ['Leads', 'Prospectos'],
          ['Review and manage communications sent to Ucarianos.', 'Revisa y administra las comunicaciones enviadas a los ucarianos.'],
          ['Load More Notifications', 'Cargar mas notificaciones']
        ];

        function replaceText(value) {
          if (!value) return value;

          var output = value;
          dictionary.forEach(function (pair) {
            output = output.split(pair[0]).join(pair[1]);
          });

          return output;
        }

        var textNodes = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
        while (textNodes.nextNode()) {
          var node = textNodes.currentNode;
          var original = node.nodeValue || '';
          var replaced = replaceText(original);
          if (replaced !== original) {
            node.nodeValue = replaced;
          }
        }

        doc.querySelectorAll('input, textarea').forEach(function (input) {
          if (input.placeholder) {
            input.placeholder = replaceText(input.placeholder);
          }
        });

        doc.querySelectorAll('option').forEach(function (option) {
          option.textContent = replaceText(option.textContent || '');
        });
      }

      function getScreenFromHash() {
        var hash = window.location.hash.replace('#', '').trim();
        return validScreens.indexOf(hash) >= 0 ? hash : defaultScreen;
      }

      function setActive(screen, writeHash) {
        var current = validScreens.indexOf(screen) >= 0 ? screen : defaultScreen;
        activeScreen = current;

        document.querySelectorAll('.screen').forEach(function (panel) {
          panel.classList.toggle('is-active', panel.getAttribute('data-screen') === current);
        });

        document.querySelectorAll('.nav-link').forEach(function (link) {
          var active = link.getAttribute('data-screen') === current;
          link.classList.toggle('is-active', active);
          if (active) {
            link.setAttribute('aria-current', 'page');
          } else {
            link.removeAttribute('aria-current');
          }
        });

        if (writeHash) {
          history.replaceState(null, '', '#' + current);
        }

        var activePanel = document.querySelector('.screen[data-screen="' + current + '"] iframe');
        if (activePanel) {
          try {
            activeScrollSource = activePanel.contentWindow || null;
            lastScrollY = getCurrentScrollY(activeScrollSource);
            applyTopbarVisibility(true);
          } catch (_) {
            activeScrollSource = null;
          }
        }
      }

      document.querySelectorAll('.screen iframe').forEach(function (frame) {
        var screenName = frame.closest('.screen') && frame.closest('.screen').getAttribute('data-screen');

        frame.addEventListener('load', function () {
          normalizeIframe(frame);
          try {
            if (frame.contentWindow) {
              attachScrollSource(screenName, frame.contentWindow);

              if (screenName === activeScreen) {
                activeScrollSource = frame.contentWindow;
                lastScrollY = getCurrentScrollY(activeScrollSource);
              }
            }
          } catch (_) {
            // Ignore cross-window access errors and continue.
          }
        });

        if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
          normalizeIframe(frame);
          try {
            if (frame.contentWindow) {
              attachScrollSource(screenName, frame.contentWindow);

              if (screenName === activeScreen) {
                activeScrollSource = frame.contentWindow;
                lastScrollY = getCurrentScrollY(activeScrollSource);
              }
            }
          } catch (_) {
            // Ignore cross-window access errors and continue.
          }
        }
      });

      document.querySelectorAll('.nav-link').forEach(function (link) {
        link.addEventListener('click', function (event) {
          event.preventDefault();
          var screen = link.getAttribute('data-screen') || defaultScreen;
          setActive(screen, true);
        });
      });

      window.addEventListener('hashchange', function () {
        setActive(getScreenFromHash(), false);
      });

      if (topbar) {
        topbar.classList.remove('is-hidden');
      }

      syncTopbarVisibility();

      setActive(getScreenFromHash(), true);
    })();
  </script>
</body>
</html>
